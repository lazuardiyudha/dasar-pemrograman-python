{d:`<h3>A. Pengenalan Pemrograman</h3><p><b>Program</b> adalah kumpulan instruksi tertulis yang dijalankan komputer untuk menyelesaikan tugas tertentu. <b>Pemrograman</b> adalah proses merancang, menulis, menguji, dan memperbaiki program tersebut. Komputer hanya mengerjakan apa yang diperintahkan, secara tepat dan berurutan, sehingga instruksi harus jelas dan tidak ambigu.</p><p><b>Algoritma</b> adalah langkah-langkah logis dan terbatas untuk menyelesaikan masalah. Ciri algoritma yang baik: ada masukan (input), ada keluaran (output), setiap langkah jelas, jumlah langkah terbatas, dan efektif. Algoritma dapat disajikan sebagai kalimat, <i>pseudocode</i>, atau <i>flowchart</i>.</p><p><b>Siklus pengembangan program:</b></p><ol><li><b>Analisis</b>: pahami masalah, data masukan, dan hasil yang diharapkan.</li><li><b>Perancangan</b>: susun algoritma atau flowchart.</li><li><b>Implementasi</b>: tulis kode dalam bahasa pemrograman.</li><li><b>Pengujian</b>: jalankan dengan berbagai data dan cari kesalahan.</li><li><b>Perbaikan dan perawatan</b>: perbaiki bug, tambahkan fitur.</li></ol><p><b>Jenis kesalahan:</b> <i>syntax error</i> (aturan penulisan dilanggar, program tidak jalan), <i>runtime error</i> (error saat program berjalan, misalnya pembagian dengan nol), dan <i>logic error</i> (program jalan tetapi hasil salah).</p><h3>B. Bahasa Pemrograman</h3><p>Bahasa pemrograman adalah bahasa buatan dengan aturan penulisan (sintaks) untuk memberi perintah kepada komputer. Komputer hanya memahami kode biner (0 dan 1), sehingga kode yang kita tulis harus diterjemahkan.</p><ul><li><b>Bahasa mesin</b>: kode biner langsung; cepat tetapi sangat sulit ditulis.</li><li><b>Bahasa assembly</b>: memakai singkatan seperti <code>MOV</code> dan <code>ADD</code>; dekat dengan perangkat keras.</li><li><b>Bahasa tingkat tinggi</b>: mirip bahasa manusia, misalnya Python, Java, C++, JavaScript, PHP.</li></ul><p><b>Penerjemah kode:</b> <b>compiler</b> menerjemahkan seluruh program sekaligus menjadi file eksekusi (contoh: C, C++), sedangkan <b>interpreter</b> menerjemahkan dan menjalankan baris demi baris (contoh: Python, JavaScript). Kompilasi biasanya lebih cepat saat dijalankan, interpretasi lebih mudah diuji dan diperbaiki.</p><p><b>Paradigma pemrograman:</b> prosedural (urutan perintah dan fungsi), berorientasi objek (class dan objek), dan fungsional (fungsi sebagai unit utama). Python mendukung ketiganya.</p><table style="width:100%;border-collapse:collapse;font-size:14px"><tr style="text-align:left"><th>Bahasa</th><th>Bidang utama</th></tr><tr><td>Python</td><td>Data, AI, web, otomasi, pendidikan</td></tr><tr><td>JavaScript</td><td>Web (tampilan dan server)</td></tr><tr><td>Java / Kotlin</td><td>Aplikasi enterprise, Android</td></tr><tr><td>C / C++</td><td>Sistem, game, perangkat keras</td></tr><tr><td>PHP</td><td>Situs web sisi server</td></tr><tr><td>SQL</td><td>Pengelolaan basis data</td></tr></table><h3>C. Pengenalan Python</h3><p>Python diciptakan oleh <b>Guido van Rossum</b> dan dirilis pertama kali tahun <b>1991</b>. Namanya berasal dari grup komedi Monty Python, bukan dari ular. Saat ini Python dikelola oleh Python Software Foundation, dan versi yang dipakai adalah <b>Python 3</b> (Python 2 sudah tidak didukung).</p><p><b>Filosofi Python</b> (The Zen of Python): sederhana lebih baik daripada rumit, keterbacaan itu penting. Python memakai <b>indentasi</b> sebagai penanda blok kode, bukan kurung kurawal, sehingga kode cenderung rapi.</p><p><b>Kelebihan:</b></p><ul><li>Sintaks ringkas dan mudah dipelajari pemula.</li><li>Gratis, sumber terbuka, dan lintas platform (Windows, macOS, Linux).</li><li>Pustaka sangat lengkap: NumPy, Pandas, Matplotlib, Flask, Django, TensorFlow.</li><li>Komunitas besar sehingga referensi dan bantuan mudah dicari.</li></ul><p><b>Keterbatasan:</b> lebih lambat dibanding bahasa terkompilasi seperti C++, dan kurang ideal untuk aplikasi seluler asli atau pekerjaan yang sangat menuntut kecepatan.</p><p><b>Penerapan:</b> analisis data, kecerdasan buatan, pengembangan web, otomasi tugas, ilmu pengetahuan, dan pengajaran pemrograman.</p><p><b>Cara menjalankan Python:</b> (1) mode interaktif (REPL) untuk mencoba satu baris; (2) mode skrip, yaitu menyimpan kode di file <code>.py</code> lalu menjalankannya dengan <code>python nama_file.py</code>; (3) editor seperti IDLE, VS Code, atau Google Colab.</p>`,
e:`<p><b>Contoh 1 - Algoritma menyeduh teh</b> (kalimat): 1) rebus air, 2) masukkan teh ke gelas, 3) tuang air panas, 4) tunggu 3 menit, 5) tambahkan gula.</p><p><b>Contoh 2 - Pseudocode</b> menghitung luas persegi panjang:</p><pre>MULAI\n  BACA panjang, lebar\n  luas = panjang x lebar\n  TULIS luas\nSELESAI</pre><p><b>Contoh 3 - Program Python pertama:</b></p><pre># program pertama\nprint("Halo, dunia!")\nprint("Nama saya Budi")\nprint(2 + 3)</pre><p>Keluaran: tiga baris, yaitu dua teks lalu angka 5. Teks ditulis dengan tanda kutip, angka dihitung langsung.</p><p><b>Contoh 4 - Kesalahan umum:</b></p><pre>print("Halo)      # syntax error: kutip tidak ditutup\nprint(10 / 0)    # runtime error: bagi nol\nprint("Luas:", 5 + 5)  # logic error jika maksud kita 5 x 5</pre>`,
s:`<p><b>Studi kasus: struk otomatis warung.</b> Ibu Rina memiliki warung dan ingin struk belanja tercetak otomatis berisi nama toko, nama barang, dan total.</p><ol><li><b>Analisis</b>: masukan = nama barang, harga, jumlah; keluaran = struk dan total.</li><li><b>Perancangan</b>: pseudocode (baca barang, hitung harga x jumlah, tulis struk).</li><li><b>Implementasi</b> awal dengan <code>print()</code>:</li></ol><pre>print("=== WARUNG BU RINA ===")\nprint("Beras 2 kg  : Rp 30000")\nprint("Minyak 1 L  : Rp 18000")\nprint("TOTAL       : Rp", 30000 + 18000)</pre><ol start="4"><li><b>Pengujian</b>: bandingkan total dengan hitungan manual (48000).</li><li><b>Perbaikan</b>: pada pertemuan berikutnya data dibuat dinamis memakai variabel dan input.</li></ol><p><b>Pelajaran:</b> kode ditulis setelah masalah dipahami dan algoritma jelas. Mulai dari versi sederhana yang berjalan, lalu kembangkan bertahap.</p><p><b>Diskusi:</b> mengapa Python cocok untuk kasus ini dibanding bahasa assembly?</p>`},
{d:`<p>Variabel menunjuk ke sebuah nilai di memori. Python memakai <b>dynamic typing</b>: tipe ditentukan otomatis dari nilainya dan dapat berubah saat variabel diisi ulang. Gunakan nama deskriptif bergaya <code>snake_case</code>, misalnya <code>total_belanja</code>.</p><p>Tipe berbeda tidak bisa digabung langsung: <code>"Umur: " + 18</code> menghasilkan error, sehingga angka harus diubah dulu dengan <code>str()</code>. Pilih tipe berdasarkan <i>fungsi</i> data, bukan tampilannya.</p>`,
e:`<pre>harga = 15000      # int\njumlah = 3         # int\ntotal = harga * jumlah\nnama_barang = "Pulpen"   # str\nprint(nama_barang, total)</pre>`,
s:`<p><b>Data mahasiswa di sistem akademik.</b> NIM disimpan sebagai <code>str</code> (bukan <code>int</code>) karena tidak dihitung dan bisa berawalan nol; IPK sebagai <code>float</code>; status aktif sebagai <code>bool</code>; nama sebagai <code>str</code>.</p><p><b>Pelajaran:</b> tipe data yang tepat mencegah kesalahan dan memudahkan pemrosesan.</p>`},
{d:`<p>Operator aritmatika <code>/</code> selalu menghasilkan <code>float</code>, sedangkan <code>//</code> membulatkan ke bawah dan <code>%</code> memberi sisa bagi. Operator perbandingan menghasilkan <code>True/False</code> dan dapat digabung dengan <code>and</code>, <code>or</code>, <code>not</code>.</p><p>Pada <code>and</code>, jika bagian kiri sudah False maka bagian kanan tidak dievaluasi (<i>short-circuit</i>). Pakai tanda kurung agar urutan hitungan jelas dibaca.</p>`,
e:`<pre>print(17 % 5)        # 2, sisa bagi\nn = 8\nprint(n % 2 == 0)    # True, n genap\nprint(7 // 2, 7 / 2) # 3 3.5</pre>`,
s:`<p><b>Diskon toko.</b> Diskon 10% berlaku jika belanja minimal Rp100.000 <i>dan</i> pembeli anggota. Kondisi: <code>belanja &gt;= 100000 and anggota</code>. Bayar = <code>belanja - belanja * 0.1</code>.</p><p><b>Pelajaran:</b> aturan bisnis diterjemahkan langsung menjadi ekspresi logika; uji dengan nilai batas (tepat 100000).</p>`},
{d:`<p>Setiap program mengikuti pola <b>IPO: Input → Proses → Output</b>. <code>input()</code> selalu mengembalikan teks, jadi nilai angka harus dikonversi dengan <code>int()</code> atau <code>float()</code>. Jika pengguna mengetik huruf, muncul <code>ValueError</code> (ditangani di pertemuan 13).</p><p>F-string memudahkan format: <code>{x:.2f}</code> untuk 2 desimal dan <code>{x:,}</code> untuk pemisah ribuan.</p>`,
e:`<pre>c = float(input("Celsius: "))\nf = c * 9 / 5 + 32\nprint(f"{c} C = {f:.1f} F")</pre>`,
s:`<p><b>Kasir warung.</b> Program meminta nama pembeli, harga, dan jumlah, lalu mencetak total. Kesalahan umum: lupa <code>int()</code>, sehingga <code>"15000" * 3</code> menghasilkan teks <code>"150001500015000"</code>, bukan 45000.</p><p><b>Pelajaran:</b> selalu cek tipe data hasil <code>input()</code>.</p>`},
{d:`<p>Percabangan memilih jalur eksekusi berdasarkan kondisi. Kondisi dievaluasi <b>dari atas ke bawah</b> dan berhenti pada yang pertama benar, sehingga urutan <code>elif</code> sangat berpengaruh: tuliskan syarat paling ketat lebih dulu. If bersarang (<i>nested</i>) dipakai bila keputusan bergantung pada keputusan sebelumnya.</p><p>Indentasi yang salah menyebabkan <code>IndentationError</code> atau perilaku yang tidak diinginkan.</p>`,
e:`<pre>nilai = 78\nif nilai >= 85:\n    print("A")\nelif nilai >= 70:\n    print("B")\nelse:\n    print("C atau kurang")</pre><p>Jika <code>nilai &gt;= 70</code> ditulis lebih dulu, nilai 90 ikut tercetak "B". Itu contoh logic error.</p>`,
s:`<p><b>Penentuan kelulusan.</b> Mahasiswa lulus bila nilai ≥ 70 <i>dan</i> kehadiran ≥ 75%. Bila nilai cukup tetapi kehadiran kurang, hasilnya "Tidak lulus (kehadiran)". Gunakan if bersarang atau <code>and</code>.</p><p><b>Pelajaran:</b> daftar semua kombinasi kondisi sebelum menulis kode.</p>`},
{d:`<p><code>for</code> menelusuri setiap elemen suatu urutan. Pola penting: <b>akumulator</b> (<code>total = 0</code> lalu <code>total += n</code> di dalam perulangan) dan <b>penghitung</b>. Perulangan bersarang menghasilkan pola dua dimensi seperti tabel dan segitiga; putaran dalam selesai penuh untuk setiap satu putaran luar.</p>`,
e:`<pre>for i in range(1, 11):\n    print(f"7 x {i} = {7 * i}")</pre>`,
s:`<p><b>Rekap iuran warga.</b> Iuran dikumpulkan selama 5 bulan. Perulangan <code>for bulan in range(1, 6)</code> meminta nominal tiap bulan lalu menjumlahkannya ke <code>total</code>, dan di akhir mencetak total kas.</p><p><b>Pelajaran:</b> pekerjaan berulang dengan jumlah pasti paling tepat memakai <code>for</code>.</p>`},
{d:`<p><code>while</code> dipakai bila jumlah pengulangan tidak diketahui di awal, misalnya "ulangi sampai input benar". Setiap <code>while</code> harus memiliki kondisi yang suatu saat berubah menjadi False; bila tidak, terjadi <i>infinite loop</i>. <code>break</code> menghentikan perulangan, <code>continue</code> melompat ke putaran berikutnya.</p>`,
e:`<pre>percobaan = 0\nwhile percobaan < 3:\n    pin = input("PIN: ")\n    if pin == "1234":\n        print("Berhasil")\n        break\n    percobaan += 1</pre>`,
s:`<p><b>Validasi PIN ATM.</b> Pengguna diberi maksimal 3 kali percobaan. Jika benar, <code>break</code>; jika 3 kali salah, kartu diblokir.</p><p><b>Pelajaran:</b> selalu sediakan batas atau jalan keluar dari perulangan agar program tidak menggantung.</p>`},
{d:`<p>String adalah urutan karakter yang <b>tidak dapat diubah</b> (<i>immutable</i>): method seperti <code>upper()</code> menghasilkan string baru. Indeks negatif menghitung dari belakang (<code>teks[-1]</code> = karakter terakhir). Slicing <code>teks[a:b]</code> mengambil indeks a sampai b-1. Operator <code>in</code> memeriksa apakah suatu potongan ada di dalam teks.</p>`,
e:`<pre>email = "  Budi@Gmail.com "\nbersih = email.strip().lower()\nprint(bersih)\nprint("@" in bersih)</pre>`,
s:`<p><b>Pendaftaran online.</b> Data nama dan email dari formulir sering berantakan (spasi berlebih, huruf besar-kecil acak). Program menormalkan dengan <code>strip()</code> dan <code>lower()</code>, lalu memvalidasi email dengan <code>"@" in email</code>.</p><p><b>Pelajaran:</b> bersihkan data sebelum disimpan atau dibandingkan.</p>`},
{d:`<p>List adalah kumpulan berurutan yang <b>dapat diubah</b> (<i>mutable</i>). Operasi umum: <code>append</code>, <code>insert</code>, <code>remove</code>, <code>pop</code>, <code>sort</code>. Slicing pada list bekerja seperti pada string. Menelusuri list dengan <code>for</code> lebih aman daripada mengakses indeks manual, yang dapat memicu <code>IndexError</code>.</p>`,
e:`<pre>nilai = [80, 75, 90]\nnilai.append(60)\nprint(max(nilai), min(nilai))\nprint(sum(nilai) / len(nilai))</pre>`,
s:`<p><b>Rekap nilai satu kelas.</b> Nilai 30 mahasiswa disimpan dalam list. Program menghitung rata-rata, nilai tertinggi, terendah, dan jumlah yang lulus memakai <code>for</code> dan <code>if</code>.</p><p><b>Pelajaran:</b> list + perulangan adalah dasar pengolahan data dalam jumlah banyak.</p>`},
{d:`<p><b>Tuple</b> bersifat tetap sehingga cocok untuk data yang tidak boleh berubah, seperti koordinat <code>(lat, lon)</code>. <b>Dictionary</b> menyimpan pasangan kunci-nilai dengan pencarian cepat; kunci harus unik. Kumpulan banyak record biasanya berupa <i>list berisi dictionary</i>, mirip baris dan kolom pada tabel.</p>`,
e:`<pre>stok = {"pulpen": 50, "buku": 30}\nstok["pulpen"] -= 5\nstok["penghapus"] = 20\nfor k in stok:\n    print(k, stok[k])</pre>`,
s:`<p><b>Stok barang toko.</b> Dictionary menyimpan nama barang dan jumlah stok; setiap penjualan mengurangi stok. Data banyak mahasiswa disimpan sebagai list of dictionary, serupa dengan baris di Google Sheets.</p><p><b>Pelajaran:</b> pilih struktur data sesuai cara data dicari dan diubah.</p>`},
{d:`<p>Fungsi menerapkan prinsip <b>DRY</b> (<i>Don't Repeat Yourself</i>). Parameter adalah variabel di definisi fungsi, argumen adalah nilai saat dipanggil. Bedakan <code>return</code> (mengembalikan nilai untuk dipakai lagi) dengan <code>print</code> (hanya menampilkan). Variabel di dalam fungsi bersifat <b>lokal</b> dan tidak terlihat dari luar.</p>`,
e:`<pre>def mutu(nilai):\n    if nilai >= 85:\n        return "A"\n    elif nilai >= 70:\n        return "B"\n    return "C"\n\nprint(mutu(90), mutu(72))</pre>`,
s:`<p><b>Hitung honor pengajar.</b> Rumus honor dipakai di banyak laporan. Dengan fungsi <code>hitung_honor(jam, tarif)</code>, perubahan rumus cukup dilakukan di satu tempat dan semua laporan ikut benar.</p><p><b>Pelajaran:</b> fungsi membuat program rapi, mudah diuji, dan mudah dirawat.</p>`},
{d:`<p>Modul adalah file Python yang dapat diimpor. Pustaka standar menyediakan banyak modul siap pakai (<code>math</code>, <code>random</code>, <code>datetime</code>), sedangkan pustaka pihak ketiga dipasang dengan <code>pip install</code>. Bentuk <code>from math import sqrt</code> memanggil fungsi langsung tanpa awalan.</p>`,
e:`<pre>import math, random\nr = 7\nprint(math.pi * r ** 2)\nprint(random.randint(1, 100))</pre>`,
s:`<p><b>Undian doorprize.</b> Panitia menarik 3 nomor pemenang dari 1 sampai 200 memakai <code>random.randint</code>. Nomor yang sudah keluar disimpan dalam list agar tidak terpilih dua kali.</p><p><b>Pelajaran:</b> manfaatkan modul yang ada sebelum menulis sendiri dari nol.</p>`},
{d:`<p>Blok <code>try/except</code> menangkap error tertentu agar program tidak berhenti mendadak. Tangkap jenis yang spesifik (<code>ValueError</code>, <code>ZeroDivisionError</code>, <code>FileNotFoundError</code>), bukan semuanya sekaligus. <code>finally</code> selalu dijalankan, dan <code>with open(...)</code> menutup file otomatis.</p>`,
e:`<pre>try:\n    a = int(input("Angka: "))\n    print(10 / a)\nexcept ZeroDivisionError:\n    print("Tidak bisa dibagi nol")\nexcept ValueError:\n    print("Masukkan angka")</pre>`,
s:`<p><b>Pencatat data sederhana.</b> Saat dibuka pertama kali, <code>data.txt</code> belum ada dan memicu <code>FileNotFoundError</code>. Program menangkapnya lalu membuat file baru, sehingga pengguna tidak melihat error.</p><p><b>Pelajaran:</b> antisipasi kegagalan yang wajar terjadi pada input dan file.</p>`},
{d:`<p>Proyek dikerjakan bertahap: <b>(1) analisis kebutuhan, (2) rancangan IPO dan algoritma, (3) implementasi per fungsi, (4) pengujian</b> dengan data normal, data batas, dan data salah, <b>(5) dokumentasi</b> dan presentasi. Kerjakan dari versi paling sederhana yang berjalan, baru tambahkan fitur.</p>`,
e:`<pre>def mutu(r):\n    return "A" if r >= 85 else "B" if r >= 70 else "C"\n\nnilai = [80, 65, 90]\nrata = sum(nilai) / len(nilai)\nprint(f"{rata:.2f} -> {mutu(rata)}")</pre>`,
s:`<p><b>Aplikasi kasir sederhana.</b> Barang disimpan dalam dictionary harga; keranjang berupa list; perulangan <code>while</code> menerima input sampai pengguna mengetik "selesai"; fungsi menghitung total dan diskon; <code>try/except</code> menjaga input; struk dicetak dengan f-string.</p><p><b>Pelajaran:</b> proyek utuh adalah gabungan semua konsep pertemuan 1-13.</p>`}
];

 const S=[];
